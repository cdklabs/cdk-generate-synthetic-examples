# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

name: build
on:
  pull_request: {}
  workflow_dispatch: {}
  merge_group: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      self_mutation_happened: ${{ steps.self_mutation.outputs.self_mutation_happened }}
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        run: yarn install --check-files
      - name: build
        run: npx projen build
      - name: Find mutations
        id: self_mutation
        run: |-
          git add .
          git diff --staged --patch --exit-code > repo.patch || echo "self_mutation_happened=true" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ./
      - name: Upload patch
        if: steps.self_mutation.outputs.self_mutation_happened
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repo.patch
          path: repo.patch
          overwrite: true
      - name: Fail build on mutation
        if: steps.self_mutation.outputs.self_mutation_happened
        run: |-
          echo "::error::Files were changed during build (see build log). If this was triggered from a fork, you will need to update your branch."
          cat repo.patch
          exit 1
  rosetta-compat:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CI: "true"
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --check-files
      - name: Install Rosetta version
        id: install_rosetta_version
        run: yarn add --dev jsii-rosetta@${{ matrix.rosetta }}
      - name: compile+test
        id: compile_test
        run: |-
          npx projen compile
          npx projen test
      - name: Check Rosetta version
        id: check_rosetta_version
        run: |-
          ACTUAL_ROSETTA=$(npx jsii-rosetta --version)
          echo "Actual version: ${ACTUAL_ROSETTA}"
          echo "Expected range: ${{ matrix.rosetta }}"
          node -e "process.exit(Number(!require('semver').satisfies('${ACTUAL_ROSETTA}', '${{ matrix.rosetta }}')))"
    strategy:
      fail-fast: false
      matrix:
        rosetta:
          - ^1.85.0
          - ~5.1.2
          - ~5.2.0
          - ~5.3.0
          - ~5.4.0
          - ~5.5.0
          - ~5.6.0
          - ~5.7.0
          - ~5.8.0
          - ~5.9.0
          - 1.85.0
          - 5.1.2
          - 5.2.0
          - 5.3.0
          - 5.4.0
          - 5.5.0
          - 5.6.0
          - 5.7.0
          - 5.8.0
          - 5.9.0
